services:
  - type: web
    name: careerpilot
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODELS
        value: openai/gpt-oss-120b,openai/gpt-oss-20b,qwen/qwen3.8-27b
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODELS
        value: google/gemini-2.5-flash,nvidia/nemotron-3.5-lightning:free
      - key: CORS_ORIGINS
        sync: false
      - key: PYTHON_VERSION
        value: "3.13"
