# Keeps the Render free-tier service awake by pinging /api/health every
# 10 minutes (Render sleeps after 15 minutes of inactivity).
#
# SETUP (one time):
#   GitHub repo -> Settings -> Secrets and variables -> Actions ->
#   New repository secret: name = RENDER_URL, value = https://your-app.onrender.com
#
# NOTE: free on public repos. If the repo is private this burns Actions
# minutes (~4,400/month) — use UptimeRobot instead. Disable this workflow
# (or delete it) when the hackathon is over.

name: Keep Render warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -m 30 \
            "${{ secrets.RENDER_URL }}/api/health")
          echo "health check returned HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::warning::service may be down (HTTP $code)"
          fi
